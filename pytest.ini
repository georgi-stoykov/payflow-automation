[pytest]
testpaths = tests
markers =
    quotes: quote creation, pricing, fees, expiry
    payments: payment creation, lifecycle, webhooks
    idempotency: idempotency-key semantics on payment creation
    pagination: payments list limit/offset semantics
    kyc: KYC gating of payment creation
    ui: Playwright tests against the web console
    slow: tests that wait on real time (quote expiry, lifecycle progression)
